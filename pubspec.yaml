name: gesco
description: "GESCO — Gestión Escolar de la UPIIZ (IPN). Solicitudes y documentos del Departamento de Gestión Escolar, en web y en celular."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Bricolage Grotesque (títulos) y Plus Jakarta Sans (cuerpo).
  # Las descarga la primera vez y las cachea. Si en la escuela hay equipos sin
  # internet, hay que bajarlas a assets/fonts/ y declararlas aquí abajo; el
  # código de AppTypography no cambia.
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
